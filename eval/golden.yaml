  notes: 'Interpretation: expired in 2020 = expired_date within calendar 2020, whatever the current status; licences and spectrum leases (call sign L + 9 digits, v_uls_licences.is_lease; open question j) are counted separately, in that column order. Expected 2 licences and 26 leases.'
