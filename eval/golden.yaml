    - - China
      - 12962
    - - Taiwan
      - 3717
    - - South Korea
      - 2738
    - - Hong Kong
      - 2397
    row_count: 5
    checked_on: '2026-10-24'
    via: sql-mcp
- id: sql-12
  type: sql
  status: reviewed
  question: How many grantees and how many accredited test firms are in Japan?
  reference_sql: |-
    SELECT (SELECT count(*) FROM fcc_grantees WHERE country = 'Japan') AS grantees,
           (SELECT count(*) FROM fcc_test_firms WHERE country = 'Japan') AS test_firms
  notes: 'Interpretation: country = ''Japan''; test firms are rows of fcc_test_firms. All test firms are expired as of today (open question h), so "accredited" means listed in the 2021 snapshot.'
  reference_result:
    columns:
