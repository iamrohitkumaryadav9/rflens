- id: mixed-01
  type: mixed
  author: assistant
  status: reviewed
  spec: '36.101'
  ordered: true
  question: Which 5 licensees hold the most active cellular licences with frequencies inside the LTE band 5 uplink range defined in TS 36.101?
  expected_clauses:
  - '5.5'
  confirmed_chunks:
  - 36.101@19.6.0/5.5/2
  reference_sql: |-
    SELECT count(DISTINCT f.usi) AS active_licences
    FROM v_uls_frequencies f
    JOIN v_uls_licences l ON l.service = f.service AND l.usi = f.usi
    WHERE f.license_status = 'A' AND NOT l.is_lease AND f.frequency_assigned >= 824 AND COALESCE(f.frequency_upper_band, f.frequency_assigned) <= 849
    GROUP BY l.licensee_frn
    ORDER BY active_licences DESC, l.licensee_frn
    LIMIT 5
  notes: 'Interpretation: doc part: E-UTRA band 5 uplink = 824-849 MHz (TS 36.101 clause 5.5, chunk 36.101@19.6.0/5.5/2). SQL part: licensees counted by licensee_frn (open question k), active = license_status ''A'' (assumed), leases excluded; top 5 so the result is reviewable (154 licensees qualify; no tie at the cutoff: 42, then 27). The reference returns the counts only (422, 315, 283, 278, 42), like sql-18, so any correct way of naming the licensees passes. Expected, in order: Cellco Partnership 0003290673, New Cingular Wireless PCS, LLC 0003291192, AT&T Mobility Spectrum, LLC 0014980726, Alltel Corporation 0002942159, CommNet Cellular Inc. 0017329715. ''Inside a range'' = the whole assigned block lies within it (frequency_assigned >= low and COALESCE(frequency_upper_band, frequency_assigned) <= high). ULS frequencies are ASSUMED MHz (open question a). Band edges are numbers from the spec table.'
  reference_result:
    columns:
    - active_licences
    rows:
    - - 422
    - - 315
    - - 283
    - - 278
    - - 42
    row_count: 5
    checked_on: '2026-10-25'
    via: sql-mcp
