version: 1
description: 'Golden questions for RFLens, all types (sql, doc, mixed, refuse). author = who wrote the question (human: edited and reviewed by the project owner; assistant: drafted by the assistant). status is draft until a human has reviewed a question, then reviewed.'
questions:
- id: sql-01
  type: sql
  author: human
  status: reviewed
  question: How many SECOM production runs failed?
  reference_sql: SELECT count(*) AS failed_runs FROM secom_runs WHERE label = 'fail'
  notes: 'Interpretation: a failed run is label = ''fail'' (source class 1).'
  reference_result:
    columns:
    - failed_runs
    rows:
    - - 104
    row_count: 1
    checked_on: '2026-10-25'
    via: sql-mcp
- id: sql-02
  type: sql
  author: human
  status: reviewed
  question: How many SECOM runs failed in August 2008?
  reference_sql: |-
    SELECT count(*) AS failed_runs
    FROM secom_runs
    WHERE label = 'fail' AND run_ts >= '2008-08-01' AND run_ts < '2008-09-01'
  notes: 'Interpretation: the month is taken from run_ts (no time zone), 2008-08-01 inclusive to 2008-09-01 exclusive.'
  reference_result:
    columns:
    - failed_runs
    rows:
    - - 51
    row_count: 1
    checked_on: '2026-10-25'
    via: sql-mcp
- id: sql-03
  type: sql
  author: human
  status: reviewed
  ordered: true
  question: Which 8 SECOM sensor features have the most missing values?
  reference_sql: |-
    SELECT feature_idx, count(*) AS missing_values
    FROM secom_measurements
    WHERE value IS NULL
    GROUP BY feature_idx
    ORDER BY missing_values DESC, feature_idx
    LIMIT 8
  notes: 'Interpretation: missing = NULL value; the result is feature_idx and its missing count, ranked. No tie at the cutoff: ranks 1-4 (features 158, 159, 293, 294) have 1,429 and ranks 5-8 (features 86, 221, 359, 493) have 1,341, then rank 9 has 1,018 (checked). Ties inside the top 8 are ordered by feature_idx ascending (the agent prompt carries the same general rule). The question was changed from 7 to 8 because 7 would split the four-way tie at 1,341.'
  reference_result:
    columns:
    - feature_idx
    - missing_values
    rows:
    - - 158
      - 1429
    - - 159
      - 1429
    - - 293
      - 1429
    - - 294
      - 1429
    - - 86
      - 1341
    - - 221
      - 1341
    - - 359
      - 1341
    - - 493
      - 1341
    row_count: 8
    checked_on: '2026-10-25'
    via: sql-mcp
- id: sql-04
  type: sql
  author: human
  status: reviewed
  question: What is the average value of SECOM feature 60 for failing runs versus passing runs?
  reference_sql: |-
    SELECT label, avg(value) AS avg_value
    FROM v_secom_values
    WHERE feature_idx = 60
    GROUP BY label
  notes: 'Interpretation: feature 60 is feature_idx = 60; NULL readings are ignored by avg(); one row per label. The sensor unit is unknown (anonymised).'
  reference_result:
    columns:
    - label
    - avg_value
    rows:
    - - pass
      - 2.563464217032969
    - - fail
      - 8.515123076923071
    row_count: 2
    checked_on: '2026-10-25'
    via: sql-mcp
- id: sql-05
  type: sql
  author: human
  status: reviewed
  question: How many cellular licences are currently active?
  reference_sql: SELECT count(*) AS active_licences FROM v_uls_licences WHERE license_status = 'A' AND NOT is_lease
  notes: 'Interpretation: licences exclude spectrum leases (call sign L + 9 digits, v_uls_licences.is_lease; open question j); ''A'' assumed active: currently active = license_status ''A'', whose meaning the FCC layout document does not define (open question b). Only the cell service is loaded. With leases the count would be 3,861 (2,129 of them leases).'
  reference_result:
    columns:
    - active_licences
    rows:
    - - 1732
    row_count: 1
    checked_on: '2026-10-25'
    via: sql-mcp
- id: sql-06
  type: sql
  author: human
  status: reviewed
  ordered: true
  question: Which 3 licensees, counted by FCC Registration Number, hold the most active cellular licences (excluding spectrum leases)?
  reference_sql: |-
    SELECT licensee_frn, count(*) AS active_licences
    FROM v_uls_licences
    WHERE license_status = 'A' AND NOT is_lease
    GROUP BY licensee_frn
    ORDER BY active_licences DESC, licensee_frn
    LIMIT 3
  notes: 'Interpretation: active = license_status ''A'' (assumed, open question b); spectrum leases excluded with NOT is_lease (open question j); licensee = the entity of type ''L'' (meaning unconfirmed), counted by licensee_frn so that spelling variants of one company count together (open question k); the result is the FRN and the count, ranked. Top 3: 0003290673 Cellco Partnership 422, 0003291192 New Cingular Wireless PCS 315, 0014980726 AT&T Mobility Spectrum 283; rank 4 (0002942159 Alltel) has 278, so no tie at the cutoff. Counted by name the ranking would differ.'
  reference_result:
    columns:
    - licensee_frn
    - active_licences
    rows:
    - - 0003290673
      - 422
    - - 0003291192
      - 315
    - - 0014980726
      - 283
    row_count: 3
    checked_on: '2026-10-25'
    via: sql-mcp
- id: sql-07
