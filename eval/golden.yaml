- id: sql-11
  type: sql
  status: reviewed
  ordered: true
  question: Which 5 countries have the most FCC equipment grantees?
  reference_sql: |-
    SELECT country, count(*) AS grantees
    FROM fcc_grantees
    WHERE country IS NOT NULL
    GROUP BY country
    ORDER BY grantees DESC, country
    LIMIT 5
  notes: 'Interpretation: country as entered in the source (158 grantees have none and are ignored); the snapshot ends 2021-03-22 (open question f). No ties at the cutoff.'
