- id: sql-13
  type: sql
  status: reviewed
  ordered: true
  question: Which countries have grantees but no accredited test firm? Top 10 by grantee count.
  reference_sql: |-
    SELECT g.country, count(*) AS grantees
    FROM fcc_grantees g
    WHERE g.country IS NOT NULL
      AND NOT EXISTS (SELECT 1 FROM fcc_test_firms t WHERE t.country = g.country)
    GROUP BY g.country
    ORDER BY grantees DESC, g.country
    LIMIT 10
  notes: 'Interpretation: countries are matched by name as entered in both tables (both use English names); result is country and grantee count. Ranks 6 and 7 tie at 33 (Poland, South Africa), inside the top 10; no tie at the cutoff (21, then 20). All test firms are expired (open question h).'
