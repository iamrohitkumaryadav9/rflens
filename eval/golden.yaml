- id: sql-14
  type: sql
  status: reviewed
  question: When was the ULS cellular snapshot taken, and under what licence is the data published?
  reference_sql: |-
    SELECT f.snapshot_date, d.licence
    FROM (SELECT DISTINCT snapshot_date FROM uls_file_counts WHERE service = 'cell') f
    CROSS JOIN (SELECT licence FROM data_sources WHERE name = 'uls_cell') d
  notes: 'Interpretation: snapshot_date of the loaded cell file (uls_file_counts, the FCC weekly file creation date) and the licence recorded for the source uls_cell in data_sources.'
  reference_result:
    columns:
    - snapshot_date
    - licence
    rows:
    - - '2026-10-18'
      - US Government Work (https://www.usa.gov/government-works)
    row_count: 1
    checked_on: '2026-10-24'
    via: sql-mcp
