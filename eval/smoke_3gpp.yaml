# Smoke eval for 3GPP retrieval (make eval-smoke).
#
# Ten questions drafted by the assistant from the structure of the specs. The expected clauses
# and tables of q01-q10 were reviewed by a human (reviewed-labels); the questions are still a
# small smoke set, so treat recall numbers as a sanity check, not as a result. Questions cite
# clause numbers only; no spec text is quoted here (3GPP specs are copyrighted).
#
# A question is answered if any of the top 5 chunks is from `spec` and its clause is exactly one
# of `expected_clauses` (a sub-clause such as 6.2.3.5 does not count for 6.2.3) or its table
# number is listed in `expected_tables`.
status: reviewed-labels
questions:
  - id: q01
    spec: "38.101-1"
    question: "Which NR operating bands exist in FR1 and what are their uplink and downlink frequency ranges?"
    expected_clauses: ["5.2"]
    expected_tables: ["5.2-1"]
  - id: q02
    spec: "38.101-1"
    question: "What is the maximum output power and tolerance for power class 3 in band n78?"
    expected_clauses: ["6.2.1"]
    expected_tables: ["6.2.1-1"]
  - id: q03
    spec: "38.101-1"
    question: "How much maximum power reduction is the UE allowed for different modulations and resource block allocations?"
    expected_clauses: ["6.2.2"]
    expected_tables: []
  - id: q04
    spec: "38.101-1"
    question: "What additional maximum power reduction applies when network signalling value NS_04 is used?"
    expected_clauses: ["6.2.3.2"]
    expected_tables: []
  - id: q05
    spec: "38.101-1"
    question: "What is the minimum output power the UE transmitter must be able to reach?"
    expected_clauses: ["6.3.1"]
    expected_tables: []
  - id: q06
    spec: "38.101-1"
    question: "How is the occupied bandwidth of the UE transmission defined and limited?"
    expected_clauses: ["6.5.1"]
    expected_tables: []
  - id: q07
    spec: "38.101-1"
    question: "What is the reference sensitivity level for band n78 with a 20 MHz channel bandwidth?"
    expected_clauses: ["7.3.2"]
    expected_tables: []
  - id: q08
    spec: "38.101-1"
    question: "What are the in-band blocking requirements for the NR UE receiver?"
    expected_clauses: ["7.6.2"]
    expected_tables: []
  - id: q09
    spec: "36.101"
    question: "Which E-UTRA operating bands are defined and which are FDD or TDD?"
    expected_clauses: ["5.5"]
    expected_tables: ["5.5-1"]
  - id: q10
    spec: "36.101"
    question: "What is the LTE UE maximum output power for power class 3?"
    expected_clauses: ["6.2.2"]
    expected_tables: ["6.2.2-1"]
