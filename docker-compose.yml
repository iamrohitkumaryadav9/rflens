services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rflens
      POSTGRES_PASSWORD: rflens
      POSTGRES_DB: rflens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rflens -d rflens"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
