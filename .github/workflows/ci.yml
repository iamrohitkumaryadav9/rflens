name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rflens
          POSTGRES_PASSWORD: rflens
          POSTGRES_DB: rflens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rflens -d rflens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://rflens:rflens@localhost:5432/rflens
      DOCS_READER_PASSWORD: ci-only-docs-reader-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
