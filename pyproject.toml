[project]
name = "rflens"
version = "0.1.0"
description = "RFLens: agentic RF data platform"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langgraph==1.2.17",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.6",
    "sqlglot==30.22.0",
    "streamlit==1.66.1",
    "ucimlrepo==0.0.7",
    "uvicorn==0.54.0",
]

[project.scripts]
rflens = "rflens.graph.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rflens"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
